<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Cyberpunk Burning Man Ω</title></head><body>
<script type="module">
async function load(){
  const names=['index.payload.0.txt','index.payload.1.txt','index.payload.2.txt','index.payload.3.txt'];
  const parts=await Promise.all(names.map(n=>fetch(new URL('./'+n,import.meta.url)).then(r=>r.text())));
  const bin=Uint8Array.from(atob(parts.join('')),c=>c.charCodeAt(0));
  const ds=new DecompressionStream('gzip');
  const stream=new Blob([bin]).stream().pipeThrough(ds);
  const html=await new Response(stream).text();
  document.open();document.write(html);document.close();
}
load().catch(e=>{document.body.textContent='Shell inflate failed: '+e});
</script>
</body></html>
